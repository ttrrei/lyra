[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra"
version = "0.1.0"
description = "Open-source research framework for universal trading strategies, keeping alpha in sync with OCI Object Storage."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "ttrrei"}]
# 核心依赖刻意保持轻量（R10：≤ 15 个包）；
# 具体版本锁在 requirements.lock（0002 起随代码逐步补全）。
dependencies = [
    "pydantic>=2.7",      # strategy YAML / config 模型
    "pyyaml>=6.0",        # YAML 解析
    "duckdb>=1.0",        # Hybrid 特征存储查询（R3）
    "pyarrow>=15.0",      # Parquet I/O
    "numpy>=2.0",          # feature computation arrays (transitive via duckdb/pandas, now declared)
    "pytz>=2023.3",       # reading TIMESTAMP WITH TIME ZONE in DuckDB (hard dep, verified 0002)
    "typer>=0.12",        # CLI
    "requests>=2.31",     # OCI PAR download (0002, moneta-proven mechanism)
    "TA-Lib>=0.8.2",      # 0003 K1: standard indicator C core (both prior generations locked 0.8.2)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]
# 跨库对照组（0003 K1 双实现交叉验证）：pandas-ta-classic 是主要对照组
# （活跃维护、276 指标、全长度 NaN 前缀与 TA-Lib 同行为、覆盖
# plus_di/minus_di/supertrend/hull）；tulipy 是补充锚点（C 后端独立代码
# 路径、免 pandas，但 2019-04 后停更）。仅测试期 import，不进运行时
# 核心依赖（R10 保持 ≤15 核心包）。装法：pip install "lyra[control]"。
control = ["pandas-ta-classic", "tulipy"]

[project.scripts]
lyra = "lyra.cli:app"

[tool.setuptools.packages.find]
include = ["lyra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
