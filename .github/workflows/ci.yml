name: ci

on:
  push:
    branches: [main]
  pull_request:

# 0009 D9: Python version policy matrix (>=3.11,<3.13 per pyproject.toml;
# 3.12 is the validated dev baseline).
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12 is the pinned support: requirements.lock targets 3.12
        # (numpy 2.5.4 ships cp312 wheels only; 3.11 would need an older numpy).
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      # Alpha boundary gate (AGENTS.md "Never commit alpha paths to git. CI checks
      # this."): strategies/ is closed-source alpha (v01 baseline + vNN candidates +
      # hypothesis/lessons). The ONLY git-tracked strategies subtrees are examples/
      # (public samples) and temp/ (read-only corpus for 0010 triage). Fail if any
      # other strategies file is tracked — this is the leak that .gitignore alone
      # cannot guarantee (see docs/review/overall-qwen-local-git-oci-边界检查.md).
      - name: Alpha-in-git gate (strategies/ → examples/ + temp/ only)
        run: |
          echo "Tracked files under strategies/:"
          git ls-files 'strategies/'
          echo "---"
          bad=$(git ls-files 'strategies/' | grep -vE '^strategies/(examples|temp)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Alpha strategy files committed to git (must live in OCI only):"
            echo "$bad"
            exit 1
          fi
          echo "OK: no alpha strategy files tracked in git"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      # TA-Lib (a core dep) ships manylinux wheels for cp311/cp312, so this
      # is a pure pip install — no system build step needed.
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Lint (pyflakes)
        run: python -m pyflakes lyra tests

      - name: Test
        run: python -m pytest -q
