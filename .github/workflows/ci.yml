name: ci

on:
  push:
    branches: [main]
  pull_request:

# 0009 D9: Python version policy matrix (>=3.11,<3.13 per pyproject.toml;
# 3.12 is the validated dev baseline).
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12 is the pinned support: requirements.lock targets 3.12
        # (numpy 2.5.4 ships cp312 wheels only; 3.11 would need an older numpy).
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      # TA-Lib (a core dep) ships manylinux wheels for cp311/cp312, so this
      # is a pure pip install — no system build step needed.
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Lint (pyflakes)
        run: python -m pyflakes lyra tests

      - name: Test
        run: python -m pytest -q
